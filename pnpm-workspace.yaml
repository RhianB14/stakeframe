packages:
  - apps/*
  - packages/*

overrides:
  '@esbuild-kit/core-utils>esbuild': '0.25.12'
  'miniflare>sharp': '0.35.4'
  # GHSA-3wwx-pv8p-q78v / CVE-2026-85024 (moderate): DoS via unhandled error in
  # WebSocket permessage-deflate decompression. Transitiva de miniflare>undici
  # (devDep do ecossistema wrangler); 7.29.0 afetada, 7.29.1 corrigida.
  undici: '7.29.1'

allowBuilds:
  esbuild: true
  '@tailwindcss/oxide': true
  workerd: true
  # core-js: postinstall apenas de funding/telemetria — não é necessário.
  core-js: false

minimumReleaseAgeExclude:
  - '@better-auth/core@1.7.3'
  - '@better-auth/drizzle-adapter@1.7.3'
  - '@better-auth/kysely-adapter@1.7.3'
  - '@better-auth/memory-adapter@1.7.3'
  - '@better-auth/mongo-adapter@1.7.3'
  - '@better-auth/prisma-adapter@1.7.3'
  - '@better-auth/telemetry@1.7.3'
  - better-auth@1.7.3
  - posthog-js@1.434.15
