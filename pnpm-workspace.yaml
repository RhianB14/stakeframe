packages:
  - apps/*
  - packages/*

overrides:
  '@esbuild-kit/core-utils>esbuild': '0.25.12'
  'miniflare>sharp': '0.35.4'
  # GHSA-qhr7-859c-m2p7 / GHSA-6j4f-fj2g-mc7p / GHSA-q2hr-2g5m-vwhr: todos os
  # caminhos passam por minimatch (unico pai de brace-expansion na arvore).
  'minimatch>brace-expansion': '5.0.12'
  # GHSA-hrr3-gc8f-f4qj / GHSA-jvvf-x445-j334: fast-uri em duas linhas majors
  # distintas. Pin por caminho preserva o major declarado por cada pai
  # (ajv pede ^3.0.1; fast-json-stringify e @fastify/ajv-compiler pedem ^4.0.0).
  'ajv>fast-uri': '3.1.8'
  'json-schema-resolver>fast-uri': '3.1.8'
  '@fastify/ajv-compiler>fast-uri': '4.1.5'
  'fast-json-stringify>fast-uri': '4.1.5'
  # GHSA-3wwx-pv8p-q78v / CVE-2026-85024 (moderate): DoS via unhandled error in
  # WebSocket permessage-deflate decompression. Transitiva de miniflare>undici
  # (devDep do ecossistema wrangler); 7.29.0 afetada, 7.29.1 corrigida.
  undici: '7.29.1'
  # GHSA-68fv-2mgg-jv7q: source-map-js <1.2.2 permite DoS no event loop via
  # offsets de seções indexadas; pin global na primeira versão corrigida.
  source-map-js: '1.2.2'

allowBuilds:
  esbuild: true
  '@tailwindcss/oxide': true
  workerd: true
  # core-js: postinstall apenas de funding/telemetria — não é necessário.
  core-js: false

minimumReleaseAgeExclude:
  - '@better-auth/core@1.7.3'
  - '@better-auth/drizzle-adapter@1.7.3'
  - '@better-auth/kysely-adapter@1.7.3'
  - '@better-auth/memory-adapter@1.7.3'
  - '@better-auth/mongo-adapter@1.7.3'
  - '@better-auth/prisma-adapter@1.7.3'
  - '@better-auth/telemetry@1.7.3'
  - better-auth@1.7.3
  - posthog-js@1.434.15
