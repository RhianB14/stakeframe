packages:
  - apps/*
  - packages/*

overrides:
  '@esbuild-kit/core-utils>esbuild': '0.25.12'

allowBuilds:
  esbuild: true
  '@tailwindcss/oxide': true
  workerd: true

minimumReleaseAgeExclude:
