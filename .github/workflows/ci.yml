name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  format-check:
    name: format-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

  application-check:
    name: application-check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check types and lint
        run: |
          pnpm typecheck
          pnpm lint
      - name: Audit known dependency vulnerabilities
        run: pnpm audit
      - name: Validate the generated API contract
        run: pnpm api:spec:check
      - name: Unit tests and build
        run: |
          pnpm test
          pnpm build
      - name: Start the local stack with disposable credentials
        run: |
          pnpm local:init
          pnpm local:up
      - name: PostgreSQL 18, Google auth protocol and pg-boss integration
        run: pnpm local:test-db
      - name: Browser checks on desktop and mobile
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm test:e2e
      - name: Stop the local stack
        if: always()
        run: |
          if [ -f .env.local ]; then pnpm local:down; fi

  network-security-simulation:
    name: network-security-simulation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Simulate network safety without privileged commands
        run: python3 -B -m unittest discover -s scripts/network_security -p 'test_*.py' -v
