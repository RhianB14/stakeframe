name: Promotion record

# STK-F1-12: manual promotion gate. This workflow never deploys, never uses
# SSH and holds no production secrets: after the owner approves the
# `production` environment, it verifies the promotion evidence of an approved
# candidate run and emits the immutable promotion record with the fixed
# digests. It accepts evidence from the reviewed release-candidate or
# candidate-images workflow paths only. The deployment itself is manual,
# over restricted SSH, following
# docs/deploy/promotion-runbook.md.

on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Run id of a reviewed Release candidate or Candidate images workflow
        required: true
        type: string
      deployment_id:
        description: Stable deployment identifier from the private deployment.env
        required: true
        type: string
      publication_run_id:
        description: >-
          For release-candidate, run id of the Publish approved candidate workflow.
          For candidate-images, use the same run id as candidate_run_id. The
          approval registry remains the gate that names the candidate and digests.
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: promotion-record
  cancel-in-progress: false

jobs:
  record:
    name: promotion-record
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout reviewed workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download candidate and publication evidence from the approved runs
        env:
          RUN_ID: ${{ inputs.candidate_run_id }}
          PUBLICATION_RUN_ID: ${{ inputs.publication_run_id }}
        run: |
          set -euo pipefail
          mkdir -p .cache/promotion/evidence
          gh api "repos/RhianB14/stakeframe/actions/runs/$RUN_ID" > .cache/promotion/run.json
          SOURCE_SHA="$(python3 -c 'import json;print(json.load(open(".cache/promotion/run.json"))["head_sha"])')"
          RUN_PATH="$(python3 -c 'import json;print(json.load(open(".cache/promotion/run.json"))["path"])')"
          case "$RUN_PATH" in
            .github/workflows/release-candidate.yml)
              PUBLICATION_ARTIFACT="publication-$PUBLICATION_RUN_ID"
              ;;
            .github/workflows/candidate-images.yml)
              [[ "$PUBLICATION_RUN_ID" == "$RUN_ID" ]] || { echo "PROMOTION_RUN_ID_MISMATCH"; exit 1; }
              PUBLICATION_ARTIFACT="candidate-evidence-$SOURCE_SHA-arm64"
              ;;
            *)
              echo "PROMOTION_RUN_WORKFLOW_REFUSED"
              exit 1
              ;;
          esac
          # Candidate archives carry candidate.json. The publication evidence
          # is either publication-<run id> (release-candidate) or
          # candidate-evidence-<sha>-arm64 from the same candidate-images run.
          # infra/release/approved-arm64.json remains the source of the approved
          # candidate run id and digests; neither evidence path bypasses it.
          # The record script cross-checks the candidate claims and registry
          # digests; the candidate-images path also requires equal run ids.
          # The production environment gate above remains mandatory.
          # Production is arm64 and only arm64 is published, so only arm64 is
          # composed — the record must not assert anything the evidence lacks.
          CANDIDATE_DIR="$(mktemp -d)"
          gh run download "$RUN_ID" -R RhianB14/stakeframe \
            -n "candidate-$SOURCE_SHA-arm64" -D "$CANDIDATE_DIR"
          cp "$CANDIDATE_DIR/candidate.json" .cache/promotion/evidence/candidate.json
          rm -rf "$CANDIDATE_DIR"
          PUBLICATION_DIR="$(mktemp -d)"
          gh run download "$PUBLICATION_RUN_ID" -R RhianB14/stakeframe \
            -n "$PUBLICATION_ARTIFACT" -D "$PUBLICATION_DIR"
          if [[ "$RUN_PATH" == ".github/workflows/candidate-images.yml" ]]; then
            cmp .cache/promotion/evidence/candidate.json "$PUBLICATION_DIR/candidate.json"
          fi
          cp "$PUBLICATION_DIR/published.json" .cache/promotion/evidence/published.json
          rm -rf "$PUBLICATION_DIR"
          echo "PROMOTION_EVIDENCE_DOWNLOADED $SOURCE_SHA"
      - name: Verify evidence and compose the promotion record
        run: |
          set -euo pipefail
          python3 -B scripts/release/promotion_record.py prepare \
            --run-json .cache/promotion/run.json \
            --evidence .cache/promotion/evidence \
            --deployment-id "${{ inputs.deployment_id }}" \
            --requested-by "${{ github.actor }}" \
            --output .cache/promotion/promotion-record.json
      - name: Retain the promotion record
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: promotion-record-${{ inputs.deployment_id }}-${{ github.run_id }}
          path: .cache/promotion/promotion-record.json
          retention-days: 90
          if-no-files-found: error
