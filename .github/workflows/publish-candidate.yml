name: Publish approved candidate

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: publish-approved-candidate
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      packages: write
    steps:
      - name: Checkout reviewed publisher
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Require current publisher main and successful CI
        env:
          SOURCE_SHA: ${{ github.sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/release/source.mjs
      - name: Retrieve the exact approved GitHub artifact
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/release/download-approved.mjs
      - name: Verify every archive and approved index before registry access
        run: python3 -B scripts/release/publication.py verify
      - name: Install registry transport
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends skopeo
          skopeo --version
      - name: Publish unchanged indexes and verify registry manifests
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: python3 -B scripts/release/publication.py publish
      - name: Retain publication evidence
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: publication-${{ github.run_id }}
          path: |
            .cache/publication/verified.json
            .cache/publication/published.json
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error
