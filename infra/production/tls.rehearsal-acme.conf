# Rehearsal-only globals, mounted at /etc/caddy/global.d/ by
# compose.rehearsal.yml. Production has no file in that directory, so the
# import in the production Caddyfile expands to nothing.
acme_ca https://pebble:14000/dir
acme_ca_root /etc/caddy/pebble/pebble.minica.pem
renew_interval 1m
renewal_window_ratio 0.98
