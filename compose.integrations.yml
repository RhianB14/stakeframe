# Apply with compose.production.yml only after the production activation is authorized.
services:
  api:
    environment:
      R2_ATTACHMENTS_ENABLED: 'true'
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:?R2 account required}
      R2_ATTACHMENTS_BUCKET: ${R2_ATTACHMENTS_BUCKET:?Private attachments bucket required}
      R2_ATTACHMENTS_ACCESS_KEY_ID_FILE: /run/secrets/r2_reader_access_key
      R2_ATTACHMENTS_SECRET_ACCESS_KEY_FILE: /run/secrets/r2_reader_secret_key
      TELEGRAM_BOT_TOKEN_FILE: /run/secrets/telegram_bot_token
      TELEGRAM_OWNER_USER_ID_FILE: /run/secrets/telegram_owner_user_id
      THESPORTSDB_ENABLED: 'true'
      # STK-F1-10: telemetria — os valores secretos vêm dos docker secrets com os
      # nomes exatos provisionados na VPS; flags não-secretos chegam pelo runtime.
      SENTRY_DSN_FILE: /run/secrets/sentry_dsn_api
      SENTRY_PUBLIC_DSN_FILE: /run/secrets/sentry_dsn_web
      POSTHOG_KEY_FILE: /run/secrets/posthog_project_api_key
      BETTER_STACK_SOURCE_TOKEN_FILE: /run/secrets/betterstack_source_token
    secrets:
      - r2_reader_access_key
      - r2_reader_secret_key
      - telegram_bot_token
      - telegram_owner_user_id
      - sentry_dsn_api
      - sentry_dsn_web
      - posthog_project_api_key
      - betterstack_source_token

  worker:
    environment:
      AI_ENABLED: 'true'
      AI_PROVIDER: openrouter
      OPENROUTER_MODEL: google/gemini-3.8-flash
      OPENROUTER_ALLOW_FALLBACKS: 'true'
      OPENROUTER_MAX_OUTPUT_TOKENS: '4096'
      OPENROUTER_REASONING_EFFORT: disabled
      OPENROUTER_TIMEOUT_MS: '60000'
      OPENROUTER_API_KEY_FILE: /run/secrets/openrouter_api_key
      AZURE_VISION_ENABLED: 'false'
      TELEGRAM_ENABLED: 'true'
      TELEGRAM_MINIAPP_URL: ${TELEGRAM_MINIAPP_URL:?Mini App URL required}
      TELEGRAM_BOT_TOKEN_FILE: /run/secrets/telegram_bot_token
      TELEGRAM_OWNER_USER_ID_FILE: /run/secrets/telegram_owner_user_id
      TELEGRAM_OWNER_CHAT_ID_FILE: /run/secrets/telegram_owner_chat_id
      R2_ATTACHMENTS_ENABLED: 'true'
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:?R2 account required}
      R2_ATTACHMENTS_BUCKET: ${R2_ATTACHMENTS_BUCKET:?Private attachments bucket required}
      R2_ATTACHMENTS_ACCESS_KEY_ID_FILE: /run/secrets/r2_writer_access_key
      R2_ATTACHMENTS_SECRET_ACCESS_KEY_FILE: /run/secrets/r2_writer_secret_key
      THESPORTSDB_ENABLED: 'true'
      AUTOMATIC_IMPORT_ENABLED: 'false'
      # STK-F1-10: telemetria — worker usa o seu próprio projeto Sentry; os
      # valores secretos vêm dos docker secrets provisionados na VPS.
      SENTRY_DSN_FILE: /run/secrets/sentry_dsn_worker
      POSTHOG_KEY_FILE: /run/secrets/posthog_project_api_key
      BETTER_STACK_SOURCE_TOKEN_FILE: /run/secrets/betterstack_source_token
    secrets:
      - openrouter_api_key
      - telegram_bot_token
      - telegram_owner_user_id
      - telegram_owner_chat_id
      - r2_writer_access_key
      - r2_writer_secret_key
      - sentry_dsn_worker
      - posthog_project_api_key
      - betterstack_source_token
    networks: [provider-egress]

networks:
  provider-egress:
    labels:
      io.stakeframe.deployment: ${DEPLOYMENT_ID:?Deployment identifier required}

secrets:
  openrouter_api_key:
    file: ${SECRET_DIRECTORY:?Private secret directory required}/openrouter_api_key
  telegram_bot_token:
    file: ${SECRET_DIRECTORY:?Private secret directory required}/telegram_bot_token
  telegram_owner_user_id:
    file: ${SECRET_DIRECTORY:?Private secret directory required}/telegram_owner_user_id
  telegram_owner_chat_id:
    file: ${SECRET_DIRECTORY:?Private secret directory required}/telegram_owner_chat_id
  r2_reader_access_key:
    file: ${SECRET_DIRECTORY:?Private secret directory required}/r2_reader_access_key
  r2_reader_secret_key:
    file: ${SECRET_DIRECTORY:?Private secret directory required}/r2_reader_secret_key
  r2_writer_access_key:
    file: ${SECRET_DIRECTORY:?Private secret directory required}/r2_writer_access_key
  r2_writer_secret_key:
    file: ${SECRET_DIRECTORY:?Private secret directory required}/r2_writer_secret_key
  b2_backup_account_id:
    file: ${SECRET_DIRECTORY:?Private secret directory required}/b2_backup_account_id
  b2_backup_application_key:
    file: ${SECRET_DIRECTORY:?Private secret directory required}/b2_backup_application_key
  sentry_dsn_web:
    file: ${SECRET_DIRECTORY:?Private secret directory required}/sentry_dsn_web
  sentry_dsn_api:
    file: ${SECRET_DIRECTORY:?Private secret directory required}/sentry_dsn_api
  sentry_dsn_worker:
    file: ${SECRET_DIRECTORY:?Private secret directory required}/sentry_dsn_worker
  posthog_project_api_key:
    file: ${SECRET_DIRECTORY:?Private secret directory required}/posthog_project_api_key
  betterstack_source_token:
    file: ${SECRET_DIRECTORY:?Private secret directory required}/betterstack_source_token
