name: stakeframe-migration

# STK-F1-12 — etapa SEPARADA de migração de schema: nunca roda junto da promoção.
# Espelha o hardening do serviço `migrate` de compose.production.yml (`x-node`) e
# roda o alvo de migração contra o PostgreSQL da instalação, unindo-se apenas à
# rede interna `backend` da stack. Consumo por digest, nunca `latest`.
# Uso, autorização, verificação e critérios de aborto: docs/deploy/migration-runbook.md.

services:
  migrate:
    image: ${MIGRATE_IMAGE:?Immutable migrate image required}
    restart: 'no'
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 512m
    cpus: 0.75
    environment:
      NODE_ENV: production
      STAKEFRAME_RUNTIME: production
      DB_PASSWORD_FILE: /run/secrets/db_password
      MIGRATION_CONFIRM: ${MIGRATION_CONFIRM:-}
    secrets: [db_password]
    networks: [backend]
    labels:
      io.stakeframe.deployment: ${DEPLOYMENT_ID:?Deployment identifier required}

networks:
  backend:
    external: true
    name: stakeframe-production_backend

secrets:
  db_password:
    file: ${SECRET_DIRECTORY:?Private secret directory required}/db_password
